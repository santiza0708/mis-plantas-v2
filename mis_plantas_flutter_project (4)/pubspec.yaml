name: mis_plantas
description: "Android MVP tracker de cuidado de plantas en Flutter con Clean Architecture y SQLite"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management (Clean & Reactive)
  flutter_riverpod: ^2.5.1

  # Local Storage (Offline-first, no cloud required)
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  path: ^1.9.0

  # Camera & Image Picking
  image_picker: ^1.1.2

  # Push Notifications (Device local scheduling)
  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.4

  # UI, Icons & Typography
  google_fonts: ^6.2.1
  intl: ^0.19.0
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
